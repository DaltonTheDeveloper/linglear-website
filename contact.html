<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Linglear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header class="header">
      <span class="header__logo">Linglear</span>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="features.html">Features</a>
        <a href="pricing.html">Pricing</a>
        <a href="community.html">Community</a>
        <a href="alpha-signup.html" class="btn">Join Alpha</a>
      </nav>
    </header>

    <main>
      <section class="section">
        <div class="glass-card" style="max-width: 600px; margin: 0 auto">
          <h1 class="section__title">Contact Us</h1>
          <p class="section__subtitle">We reply within 24 hours — no inbox black holes, just neon kindness.</p>
          <form class="form" style="margin-top: 24px">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="contact-name" placeholder="Your name" required />

            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="contact-email" placeholder="you@example.com" required />

            <label for="inquiry">Inquiry Type</label>
            <select id="inquiry" name="inquiry">
              <option>General question</option>
              <option>Media inquiry</option>
              <option>Partnership</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell us how we can help" required></textarea>

            <button class="btn" type="submit">Send Message</button>
          </form>
          <p style="margin-top: 20px; color: var(--text-muted)">Auto response: “We’ll get back to you within 24 hours.”</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2024 Linglear. Futuristic glass-morphism built for passionate polyglots.</p>
      <div class="footer__logos">
        <span>AWS</span>
        <span>Cloudflare</span>
        <span>Stripe</span>
        <span>Discord</span>
      </div>
    </footer>
    <script src="assets/js/main.js"></script>
  </body>
</html>
